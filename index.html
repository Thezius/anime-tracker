 "耳をすませば", "d": "غيبلي — عن الحب والكتابة والحلم", "n": "", "s": "t3"}, {"t": "Kimi to, Nami ni Noretara", "jp": "きみと、波にのれたら", "d": "رومانس وفقد وسريالية جميلة", "n": "", "s": "t3"}, {"t": "Watashi no Oshi wa Akuyaku Reijou", "jp": "私の推しは悪役令嬢。", "d": "من عائلة بطلة ذكية في عالم فانتازي", "n": "", "s": "t3"}, {"t": "Isekai Nonbiri Nouka", "jp": "異世界のんびり農家", "d": "إيسيكاي هادئ بلا توتر، للاسترخاء", "n": "", "s": "t3"}];
const KEY='animeTracker.v3';
/* ===== استبعاد دائم — مبني في التطبيق، ما فيه زر يلغيه ===== */
const BLOCK=['yaoi','yuri',"boys' love",'boys love','boys-love',"girls' love",'girls love','girls-love',
  'shounen ai','shounen-ai','shoujo ai','shoujo-ai','hentai','erotica'];
function blocked(){
  const names=[];
  for(const a of arguments) (a||[]).forEach(x=>names.push(String(x&&x.name?x.name:x).toLowerCase().trim()));
  return names.some(n=>BLOCK.includes(n));
}
const SMAP={}; STATUS.forEach(s=>SMAP[s[0]]=s);
const fresh=()=>({items:SEED.map((x,i)=>Object.assign({id:'s'+i,cover:'',rate:0,un:'',prog:0,eps:0,alid:0,year:0},x))});
let store=null;
try{const r=localStorage.getItem(KEY); if(r) store=JSON.parse(r);}catch(e){}
if(!store||!store.items) store=fresh();
function save(){ try{localStorage.setItem(KEY,JSON.stringify(store));}
  catch(e){ msg.textContent='تعذّر الحفظ التلقائي — استخدم «تصدير».'; } }

let filter='all', query='', sortBy='def';
const root=document.getElementById('root'), tabs=document.getElementById('tabs'),
      statsEl=document.getElementById('stats'), msg=document.getElementById('msg');

function drawStats(){
  const it=store.items, rated=it.filter(x=>x.rate>0);
  const seen=it.filter(x=>['loved','liked','watched','watching'].includes(x.s));
  const avg=rated.length?(rated.reduce((a,b)=>a+b.rate,0)/rated.length).toFixed(1):'—';
  const eps=seen.reduce((a,b)=>a+(b.eps||0),0);
  const hrs=Math.round(eps*23/60);
  const S=[[it.length,'في القائمة'],[seen.length,'شاهدته'],
           [it.filter(x=>x.s==='plan').length,'بالانتظار'],
           [avg+' \u2605','متوسط تقييمك'],[rated.length,'قيّمته'],
           [hrs?hrs+' س':'—','تقريباً شاهدت']];
  statsEl.innerHTML=S.map(s=>'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>').join('');
}
function drawTabs(){
  const c={}; store.items.forEach(i=>c[i.s]=(c[i.s]||0)+1);
  tabs.innerHTML='';
  const mk=(k,l,col,n)=>{const d=document.createElement('div');
    d.className='tab'+(filter===k?' on':''); if(filter===k) d.style.background=col;
    d.innerHTML=l+' <span class="c">'+n+'</span>';
    d.onclick=()=>{filter=k;draw();}; tabs.appendChild(d);};
  mk('all','الكل','#2b2b6f',store.items.length);
  STATUS.forEach(s=>mk(s[0],s[1],s[2],c[s[0]]||0));
  const nc=store.items.filter(noCover).length;
  if(nc) mk('nocover','بدون غلاف','#c0392b',nc);
}
const badImg=new Set();
const noCover=i=>!i.cover||badImg.has(i.id);
function stars(it){
  const d=document.createElement('div'); d.className='stars';
  for(let i=1;i<=5;i++){
    const b=document.createElement('b');
    b.textContent='\u2605'; if(i<=it.rate) b.className='on';
    b.title=i+' من ٥';
    b.onclick=()=>{ it.rate=(it.rate===i?0:i); save(); draw(); };
    d.appendChild(b);
  }
  return d;
}
function card(it){
  const c=document.createElement('div'); c.className='card';
  const opts=STATUS.map(s=>'<option value="'+s[0]+'"'+(s[0]===it.s?' selected':'')+'>'+s[1]+'</option>').join('');
  const link=it.alid?'<a href="https://anilist.co/anime/'+it.alid+'" target="_blank" title="افتح الصفحة">&#8599;</a>':'';
  c.innerHTML='<div class="tools">'+link+'<button class="x" title="حذف">&times;</button></div>'+
    (it.cover?'<img class="cv" src="'+it.cover+'">':'<div class="ph">'+it.t+'</div>')+
    '<div class="b"><div class="ti">'+it.t+'</div>'+
    ((it.year||it.eps)?'<div class="meta">'+[it.year||'',it.eps?it.eps+' حلقة':''].filter(Boolean).join(' \u00b7 ')+'</div>':'')+
    '<div class="de">'+(it.d||'')+'</div>'+(it.n?'<div class="nt">'+it.n+'</div>':'')+'</div>';
  const cv=c.querySelector('.cv'), ph=c.querySelector('.ph');
  if(ph){ ph.title='اضغط لإصلاح الغلاف'; ph.onclick=()=>openFix(it); }
  if(cv){ cv.title='اضغط لتغيير الغلاف'; cv.onclick=()=>openFix(it);
    cv.onerror=()=>{ badImg.add(it.id);
      const d=document.createElement('div'); d.className='ph'; d.textContent=it.t;
      d.title='الصورة ما حمّلت — اضغط لإصلاحها'; d.onclick=()=>openFix(it);
      cv.replaceWith(d); drawTabs(); }; }
  const b=c.querySelector('.b');
  b.appendChild(stars(it));
  if(it.s==='paused'||it.s==='watching'){
    const p=document.createElement('div'); p.className='prog';
    const lb=document.createElement('span'); lb.textContent='الحلقة'; p.appendChild(lb);
    const i1=document.createElement('input'); i1.type='number'; i1.min=0; i1.value=it.prog||0;
    i1.onchange=e=>{it.prog=+e.target.value;save();};
    p.appendChild(i1);
    const sp=document.createElement('span'); sp.textContent='/ '+(it.eps||'؟'); p.appendChild(sp);
    b.appendChild(p);
  }
  const sel=document.createElement('select'); sel.innerHTML=opts;
  sel.onchange=e=>{it.s=e.target.value;save();draw();};
  b.appendChild(sel);
  const ta=document.createElement('textarea'); ta.placeholder='ملاحظتك…'; ta.value=it.un||'';
  ta.onchange=e=>{it.un=e.target.value;save();};
  b.appendChild(ta);
  c.querySelector('.x').onclick=()=>{ if(confirm('حذف "'+it.t+'"؟')){
    store.items=store.items.filter(x=>x.id!==it.id); save(); draw(); } };
  return c;
}
function sorted(list){
  const a=list.slice();
  if(sortBy==='rate') a.sort((x,y)=>y.rate-x.rate);
  if(sortBy==='az')   a.sort((x,y)=>x.t.localeCompare(y.t));
  if(sortBy==='year') a.sort((x,y)=>(y.year||0)-(x.year||0));
  return a;
}
function draw(){
  drawStats(); drawTabs(); root.innerHTML='';
  const q=query.trim().toLowerCase();
  if(filter==='nocover'){
    const list=sorted(store.items.filter(i=>noCover(i) &&
      (!q||i.t.toLowerCase().includes(q)||(i.jp||'').includes(query))));
    const h=document.createElement('h2'); h.style.background='#c0392b';
    h.innerHTML='<span>بدون غلاف — اضغط على أي مربّع لإصلاحه</span><span class="n">'+list.length+'</span>';
    root.appendChild(h);
    const g=document.createElement('div'); g.className='grid';
    list.forEach(i=>g.appendChild(card(i))); root.appendChild(g);
    if(!list.length) root.innerHTML='<div class="empty">كل الأغلفة موجودة \u2713</div>';
    return;
  }
  const groups = filter==='all' ? STATUS.map(s=>s[0]) : [filter];
  let total=0;
  groups.forEach(k=>{
    const list=sorted(store.items.filter(i=>i.s===k &&
      (!q||i.t.toLowerCase().includes(q)||(i.jp||'').includes(query)||
       (i.d||'').includes(query)||(i.un||'').includes(query))));
    if(!list.length) return; total+=list.length;
    const h=document.createElement('h2'); h.style.background=SMAP[k][2];
    h.innerHTML='<span>'+SMAP[k][1]+'</span><span class="n">'+list.length+'</span>';
    root.appendChild(h);
    const g=document.createElement('div'); g.className='grid';
    list.forEach(i=>g.appendChild(card(i))); root.appendChild(g);
  });
  if(!total) root.innerHTML='<div class="empty">لا توجد نتائج</div>';
}

    const ch=need.slice(i,i+20);
    const q='query{'+ch.map((it,j)=>'m'+j+':Page(perPage:1){media(search:'+
      JSON.stringify(it.jp||it.t)+',type:ANIME,sort:SEARCH_MATCH)'+
      '{id episodes seasonYear coverImage{large}}}').join(' ')+'}';
    try{
      const r=await fetch('https://graphql.anilist.co',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
      const j=await r.json();
      ch.forEach((it,k)=>{ const p=j.data&&j.data['m'+k], m=p&&p.media&&p.media[0];
        it.tried=1;
        if(m){ if(m.coverImage) it.cover=m.coverImage.large;
               it.alid=m.id; it.eps=m.episodes||0; it.year=m.seasonYear||0; } });
    }catch(e){}
    await new Promise(r=>setTimeout(r,650));

    try{
      const r=await fetch('https://api.jikan.moe/v4/anime?limit=1&q='+encodeURIComponent(it.t));
      const j=await r.json(); const m=j.data&&j.data[0];

             it.eps=it.eps||m.episodes||0; it.year=it.year||m.year||0; }

  }

}

const SM={ 'current':'watching','watching':'watching','repeating':'watching','rewatching':'watching',
  'completed':'watched','complete':'watched','watched':'watched','finished':'watched',
  'paused':'paused','on-hold':'paused','on hold':'paused','onhold':'paused','hold':'paused',
  'dropped':'dropped','notinteresting':'dropped','not interesting':'dropped',
  'planning':'plan','plantowatch':'plan','plan to watch':'plan','ptw':'plan','planned':'plan' };
function mapStatus(s){ return SM[String(s||'').trim().toLowerCase()] || ''; }
function norm(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9\u3000-\u9fff]/g,''); }

function merge(rows){
  const ovr=document.getElementById('ovr').checked;
  const byId={}, byName={};
  store.items.forEach(i=>{ if(i.alid) byId[i.alid]=i; byName[norm(i.t)]=i; byName[norm(i.jp)]=i; });
  let upd=0, add=0;
  rows.forEach(r=>{
    let it = (r.alid&&byId[r.alid]) || byName[norm(r.title)] || byName[norm(r.jp)];
    if(it){
      if(ovr && r.status) it.s=r.status;
      if(r.rate) it.rate=r.rate;
      if(r.prog) it.prog=r.prog;
      if(r.eps&&!it.eps) it.eps=r.eps;
      if(r.year&&!it.year) it.year=r.year;
      if(r.alid&&!it.alid) it.alid=r.alid;
      if(r.cover&&!it.cover) it.cover=r.cover;
      upd++;
    } else {
      const o={id:'i'+Date.now()+Math.random().toString(36).slice(2,6),
        t:r.title, jp:r.jp||r.title, d:r.desc||'', n:'',
        s:r.status||'plan', cover:r.cover||'', rate:r.rate||0, un:'',
        prog:r.prog||0, eps:r.eps||0, alid:r.alid||0, year:r.year||0};
      if(o.cover) o.tried=1;
      store.items.push(o); byName[norm(o.t)]=o; if(o.alid) byId[o.alid]=o;
      add++;
    }
  });
  save(); draw();
  smsg.textContent='تم: حُدّث '+upd+' وأُضيف '+add+'. جارٍ جلب الأغلفة الناقصة…';
  enrich().then(()=>{ smsg.textContent='اكتمل الاستيراد \u2713 (حُدّث '+upd+' وأُضيف '+add+')'; });
}

/* --- Simkl / generic CSV --- */
function parseCSV(txt){
  const rows=[]; let f='', row=[], q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','||c==='\t'){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); f=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else if(c!=='\r') f+=c;
  }
  row.push(f); if(row.some(x=>x!=='')) rows.push(row);
  return rows;
}
document.getElementById('btnCSV').onclick=()=>document.getElementById('csvFile').click();
document.getElementById('csvFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  smsg.textContent='جارٍ قراءة الملف…';
  try{
    const rows=parseCSV(await f.text());
    if(rows.length<2){ smsg.textContent='الملف فاضي أو غير مفهوم'; return; }
    const H=rows[0].map(h=>h.trim().toLowerCase());
    const find=(...keys)=>H.findIndex(h=>keys.some(k=>h===k||h.includes(k)));
    const iT=find('title','name','anime'), iS=find('status','list','watchlist'),
          iR=find('rating','score','my rating','user rating'),
          iE=find('episodes watched','watched episodes','last episode watched','progress'),
          iY=find('year'), iA=find('anilist');
    if(iT<0){ smsg.textContent='ما لقيت عمود العنوان في الملف'; return; }
    const out=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const t=(r[iT]||'').trim(); if(!t) continue;
      const rt=iR>=0?parseFloat(r[iR]):0;
      out.push({ title:t,
        status: iS>=0?mapStatus(r[iS]):'',
        rate: rt? (rt>5?Math.max(1,Math.round(rt/2)):Math.round(rt)) : 0,
        prog: iE>=0?(parseInt(r[iE])||0):0,
        year: iY>=0?(parseInt(r[iY])||0):0,
        alid: iA>=0?(parseInt(r[iA])||0):0 });
    }
    if(!out.length){ smsg.textContent='ما لقيت صفوفاً صالحة'; return; }
    smsg.textContent='قرأت '+out.length+' عنوان، جارٍ الدمج…';
    merge(out);
  }catch(err){ smsg.textContent='تعذّرت قراءة الملف'; }
};

const upBox=document.getElementById('upBox');

const AR_DT=new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long',
  hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Asia/Riyadh',
  calendar:'gregory',numberingSystem:'latn'});

async function loadUp(){
  upBox.innerHTML='<div style="font-size:.82rem;color:#888">جارٍ فحص مواعيد البث…</div>';
  const ids=store.items.filter(i=>i.alid).map(i=>i.alid);

  for(let i=0;i<ids.length;i+=50){
    const q='query($ids:[Int]){Page(perPage:50){media(id_in:$ids,type:ANIME)'+
      '{id coverImage{medium} nextAiringEpisode{episode airingAt}}}}';
    try{
      const r=await fetch('https://graphql.anilist.co',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:q,variables:{ids:ids.slice(i,i+50)}})});
      const j=await r.json();
      ((j.data&&j.data.Page&&j.data.Page.media)||[]).forEach(m=>{ if(m.nextAiringEpisode) out.push(m); });
    }catch(e){}
    await new Promise(r=>setTimeout(r,650));
  }
  upData=out.sort((a,b)=>a.nextAiringEpisode.airingAt-b.nextAiringEpisode.airingAt);
  renderUp();
}
function cdText(sec){
  if(sec<=0) return 'نزلت \u2713';
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600),
        m=Math.floor(sec%3600/60), s=sec%60, p=n=>String(n).padStart(2,'0');
  return d>0 ? d+' ي  '+p(h)+':'+p(m)+':'+p(s) : p(h)+':'+p(m)+':'+p(s);
}
function renderUp(){
  if(upTimer){clearInterval(upTimer);upTimer=null;}
  const byId={}; store.items.forEach(i=>{ if(i.alid) byId[i.alid]=i; });
  const rows=(upData||[]).filter(m=>byId[m.id]);
  let h='<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<b style="color:#2b2b6f;font-size:.94rem">الحلقات القادمة</b>'+
    '<button class="g" id="upRef" style="font-size:.72rem;padding:4px 11px">تحديث</button></div>'+
    '<div style="font-size:.69rem;color:#aaa;margin:3px 0 6px">بتوقيت الرياض · أرقام الحلقات فقط، بدون عناوين</div>';
  if(!rows.length){
    h+='<div style="font-size:.82rem;color:#888;padding:6px 0">ما فيه عمل من قائمتك عليه حلقة قادمة معلنة.</div>';
  } else rows.forEach(m=>{
    const it=byId[m.id], st=SMAP[it.s]||['','',''], cov=it.cover||(m.coverImage&&m.coverImage.medium)||'';
    h+='<div class="up" data-at="'+m.nextAiringEpisode.airingAt+'">'+
      (cov?'<img src="'+cov+'">':'')+
      '<div><div class="t">'+it.t+'</div><div class="e">الحلقة '+m.nextAiringEpisode.episode+
      ' · '+AR_DT.format(new Date(m.nextAiringEpisode.airingAt*1000))+
      '<span class="tag" style="background:'+st[2]+'">'+st[1]+'</span></div></div>'+
      '<div class="cd"></div></div>';
  });
  upBox.innerHTML=h;
  document.getElementById('upRef').onclick=()=>{ upData=null; loadUp(); };
  if(!rows.length) return;
  const tick=()=>{
    const now=Date.now()/1000;
    upBox.querySelectorAll('.up').forEach(el=>{
      const sec=Math.floor(+el.dataset.at-now), c=el.querySelector('.cd');
      c.textContent=cdText(sec); c.className='cd'+(sec<86400?' soon':'');
    });
  };
  tick(); upTimer=setInterval(tick,1000);
}

  rd.readAsText(f);
};
document.getElementById('btnReset').onclick=()=>{
  if(confirm('إرجاع القائمة للحالة الأصلية؟ ستفقد تعديلاتك وتقييماتك.')){
    store=fresh(); save(); draw(); enrich(); }
};
draw(); enrich();
